[project]
name = "webhook-gateway"
version = "0.1.0"
description = "Verifies, normalises and processes webhooks from several providers on AWS"
authors = [
    {name = "cwazycodes"}
]

readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic (>=2.14.3,<3.0.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "aws-lambda-powertools (>=3.40.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "hypothesis (>=6.170.15,<7.0.0)",
    "moto[dynamodb,s3,sqs,ssm] (>=5.2.5,<6.0.0)",
    "boto3 (>=1.44.3,<2.0.0)",
    "boto3-stubs[dynamodb,s3,sqs,ssm] (>=1.44.3,<2.0.0)",
    "ruff (>=0.17.5,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "types-pyyaml (>=6.0.12.20261113,<7.0.0.0)",
    "cfn-lint (>=1.61.0,<2.0.0)"
]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.9"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
strict = true
plugins = ["pydantic.mypy"]

# cfn-lint has type hints but no py.typed marker, so mypy treats it as untyped.
[[tool.mypy.overrides]]
module = ["cfnlint.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
