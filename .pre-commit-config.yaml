# Runs on every commit once `make hooks` has installed it. `make scan-secrets`
# runs gitleaks over the whole history instead of just the staged changes.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-yaml
        # Check syntax only, so CloudFormation tags like !Ref in template.yaml pass.
        args: [--unsafe]

  # The project's own ruff, mypy and cfn-lint from poetry.lock, so a commit 
  # is checked exactly as make lint and make typecheck check it.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: cfn-lint
        name: cfn-lint
        entry: poetry run cfn-lint
        language: system
        files: ^template\.yaml$
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (whole history)
        entry: gitleaks git --redact --verbose
        stages: [manual]
        always_run: true
